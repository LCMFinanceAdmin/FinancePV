<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Gold outer ring -->
  <circle cx="100" cy="100" r="98" fill="#F5C400"/>

  <!-- Blue field -->
  <circle cx="100" cy="100" r="81" fill="#3D5FA0"/>

  <!-- 5 White rose petals (at 72° intervals) -->
  <ellipse cx="100" cy="55" rx="29" ry="40" fill="white" stroke="#e0e0e0" stroke-width="0.4" transform="rotate(0 100 100)"/>
  <ellipse cx="100" cy="55" rx="29" ry="40" fill="white" stroke="#e0e0e0" stroke-width="0.4" transform="rotate(72 100 100)"/>
  <ellipse cx="100" cy="55" rx="29" ry="40" fill="white" stroke="#e0e0e0" stroke-width="0.4" transform="rotate(144 100 100)"/>
  <ellipse cx="100" cy="55" rx="29" ry="40" fill="white" stroke="#e0e0e0" stroke-width="0.4" transform="rotate(216 100 100)"/>
  <ellipse cx="100" cy="55" rx="29" ry="40" fill="white" stroke="#e0e0e0" stroke-width="0.4" transform="rotate(288 100 100)"/>

  <!-- 5 Green sepals between petals (at 36° offsets) -->
  <ellipse cx="100" cy="37" rx="10" ry="19" fill="#3B6B35" transform="rotate(36 100 100)"/>
  <ellipse cx="100" cy="37" rx="10" ry="19" fill="#3B6B35" transform="rotate(108 100 100)"/>
  <ellipse cx="100" cy="37" rx="10" ry="19" fill="#3B6B35" transform="rotate(180 100 100)"/>
  <ellipse cx="100" cy="37" rx="10" ry="19" fill="#3B6B35" transform="rotate(252 100 100)"/>
  <ellipse cx="100" cy="37" rx="10" ry="19" fill="#3B6B35" transform="rotate(324 100 100)"/>

  <!-- Radiating thin lines through petals (30 lines at 12° intervals) -->
  <g stroke="#666" stroke-width="0.45">
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(0 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(12 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(24 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(36 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(48 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(60 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(72 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(84 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(96 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(108 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(120 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(132 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(144 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(156 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(168 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(180 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(192 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(204 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(216 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(228 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(240 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(252 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(264 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(276 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(288 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(300 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(312 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(324 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(336 100 100)"/>
    <line x1="100" y1="72" x2="100" y2="22" transform="rotate(348 100 100)"/>
  </g>

  <!-- White center disc (covers inner petal overlap) -->
  <circle cx="100" cy="100" r="29" fill="white"/>

  <!-- Red heart -->
  <path d="M 100 118
           C 82 108, 71 91, 77 79
           C 81 70, 92 70, 100 80
           C 108 70, 119 70, 123 79
           C 129 91, 118 108, 100 118 Z"
        fill="#CC1515"/>

  <!-- Black cross (Latin cross, bold) -->
  <rect x="96" y="77" width="8" height="34" fill="#111111" rx="0.5"/>
  <rect x="84" y="88" width="32" height="8" fill="#111111" rx="0.5"/>
</svg>
